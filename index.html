<!DOCTYPE HTML>
<html>
	<head>
		<title>Gift for you</title>
		<meta charset="utf-8" />

		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper" class="divided">

				<!-- One -->
					<section class="banner style1 orient-left content-align-left image-position-right fullscreen onload-image-fade-in onload-content-fade-right">
						<div class="content">
							<h1>Merry Christmas🎄</h1>

						<div class="image">
							<img src="images/bg.jpg" alt="" />
						</div>
					</section>

				<!-- Two -->
			<section class="spotlight style1 orient-right content-align-left image-position-center onscroll-image-fade-in" id="first">
						<div class="content">
							<h2>Winter</h2>
							<p></p>
							<ul class="actions stacked">
								<li><a href="subpage1.html" class="button">Learn More</a></li>
							</ul>
						</div>
						<div class="image">
							<img src="our images/winter.jpg" alt="" />
						</div>
					</section>

				<!-- Three -->
			<section class="spotlight style1 orient-left content-align-left image-position-center onscroll-image-fade-in" id="second">
						<div class="content">
							<h2>Summer</h2>
							<p></p>
							<ul class="actions stacked">
								<li><a href="subpage2.html" class="button">Learn More</a></li>
							</ul>
						</div>
						<div class="image">
							<img src="our images/summer.jpg" alt="" />
						</div>
					</section>

				<!-- Four -->
			<section class="spotlight style1 orient-right content-align-left image-position-center onscroll-image-fade-in" id="third">
				<div class="content">
					<h2>Spring & Autumn</h2>
					<p></p>
					<ul class="actions stacked">
						<li><a href="subpage3.html" class="button">Learn More</a></li>
					</ul>
				</div>
				<div class="image" style="overflow: hidden;">
					<img src="our images/autumn.jpg" alt="" style="object-position: top;" />
				</div>
			</section>



				<!-- Seven -->
						<section class="wrapper style1 align-center">
							<div class="inner medium">
								<!-- Code Input Section -->
							<div style="text-align: center;">
								<div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
									<label for="code-input" style="font-size: 1.2em; margin: 0;">Code:</label>
									<input type="text" id="code-input" placeholder="Enter code here" style="padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; width: 200px; margin: 0;" />
								</div>
								<p id="code-message" style="margin-top: 10px; color: #ff6b6b; font-size: 0.9em; display: none;">Incorrect code, please try again.</p>
							</div>
							</div>
						</section>

				</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<script>
			document.addEventListener('DOMContentLoaded', function() {
			// Code验证功能
			const codeInput = document.getElementById('code-input');
			const codeMessage = document.getElementById('code-message');
			
			if (codeInput) {
				codeInput.addEventListener('keypress', function(event) {
					if (event.key === 'Enter') {
						const enteredCode = codeInput.value.trim();
						
						if (enteredCode === '2672') {
							// 正确代码，跳转到subpage4.html
							window.location.href = 'subpage4.html';
						} else {
							// 错误代码，显示错误消息
							codeMessage.style.display = 'block';
							codeInput.value = '';
							
							// 3秒后隐藏错误消息
							setTimeout(function() {
								codeMessage.style.display = 'none';
							}, 3000);
						}
					}
				});
			}
			
			// 导航栏平滑滚动功能
			const navLinks = document.querySelectorAll('.nav-link');
			navLinks.forEach(link => {
				link.addEventListener('click', function(e) {
					e.preventDefault();
					const targetId = this.getAttribute('href').substring(1);
					const targetElement = document.getElementById(targetId);
					
					if (targetElement) {
						const elementRect = targetElement.getBoundingClientRect();
						const absoluteElementTop = elementRect.top + window.pageYOffset;
						const offsetPosition = absoluteElementTop - (window.innerHeight / 2) + (elementRect.height / 2);
						
						window.scrollTo({
							top: offsetPosition,
							behavior: 'smooth'
						});
					}
				});
			});
		});
		</script>

	</body>
</html>
